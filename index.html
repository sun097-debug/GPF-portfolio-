<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>พอร์ทออมเงิน กบข.</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap');

  :root {
    --ink: #14263D;
    --paper: #FBFAF7;
    --teal: #2F6F5E;
    --brass: #B8863A;
    --slate: #64748B;
    --rose: #B14B4B;
    --line: #E1DCCF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .serif-num { font-family: 'Noto Serif Thai', serif; }
  .hairline { border-bottom: 1px solid var(--line); }
  input, select, textarea, button {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
  }
  .hero {
    background: var(--ink);
    color: var(--paper);
    padding: 24px 20px 20px;
  }
  .hero .label { font-size: 12px; color: #9FB3C8; }
  .hero .amount { font-size: 34px; line-height: 1.15; margin-top: 6px; }
  .hero .sub { font-size: 14px; margin-top: 4px; color: #B7C6D6; }
  .tabs {
    display: flex;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 12px 0;
    margin-right: 24px;
    font-size: 14px;
    color: var(--slate);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--brass); }
  .content { padding: 20px; max-width: 480px; margin: 0 auto; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .muted { color: var(--slate); }
  .btn-primary {
    background: var(--ink); color: var(--paper); border: none;
    padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .btn-ghost {
    background: transparent; color: var(--slate); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .toggle-btn {
    flex: 1; padding: 8px; border-radius: 6px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--slate);
  }
  .toggle-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .toggle-btn-sm {
    padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--slate);
  }
  .toggle-btn-sm.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  input[type="text"], input[type="number"], input[type="date"], input[type="month"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  }
  label.field-label { display: block; font-size: 14px; color: var(--slate); margin-bottom: 4px; }
  .field { margin-bottom: 16px; }
  .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .item-row input[type="text"] { flex: 1; }
  .item-row input[type="number"] { width: 110px; }
  .remove-btn { background: none; border: none; color: var(--rose); cursor: pointer; font-size: 14px; padding: 0 6px; }
  .link-btn { background: none; border: none; color: var(--teal); font-size: 14px; cursor: pointer; padding: 0; }
  .segbar { display: flex; width: 100%; height: 10px; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  .err { color: var(--rose); font-size: 13px; margin-top: 8px; }
  .note { color: var(--slate); font-size: 12px; margin-bottom: 12px; }
  .section-title { font-size: 14px; color: var(--slate); margin-bottom: 8px; }
  .empty-state { text-align: center; padding: 40px 0; }
  .chart-wrap { height: 180px; margin-bottom: 24px; }
  .plan-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
  .plan-inputs input[type="month"] { width: 130px; flex: none; }
  .plan-inputs input[type="number"] { width: 90px; flex: none; }
</style>
</head>
<body>
<div class="hero">
  <div class="label">พอร์ทออมเงิน กบข. (เวอร์ชันทดสอบ — ข้อมูลเก็บในเครื่องนี้เท่านั้น)</div>
  <div class="amount serif-num" id="heroAmount">ยังไม่มีข้อมูล</div>
  <div class="sub" id="heroSub"></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
  const LS = {
    entries: "kgb_local_entries",
    contributions: "kgb_local_contributions",
    yearBalances: "kgb_local_year_balances",
    planLog: "kgb_local_plan_log",
  };

  const DEFAULT_CATEGORIES = [
    "ตราสารหนี้ในประเทศ",
    "ตราสารทุนในประเทศ",
    "ตราสารทุนต่างประเทศ",
    "อสังหาริมทรัพย์/โครงสร้างพื้นฐาน",
    "เงินฝาก/ตลาดเงิน",
  ];

  function load(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function save(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      state.saveError = "บันทึกไม่สำเร็จ (พื้นที่จัดเก็บในเบราว์เซอร์อาจเต็ม)";
    }
  }
  function uid() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }
  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function currentMonthISO() {
    return todayISO().slice(0, 7);
  }
  function fmtBaht(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    const num = Number(n);
    const neg = num < 0;
    const fixed = Math.abs(num).toFixed(2);
    const parts = fixed.split(".");
    const withCommas = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + withCommas + "." + parts[1];
  }
  function fmtDateThai(iso) {
    if (!iso) return "-";
    try {
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
    } catch (e) {
      return iso;
    }
  }
  function totalOf(entry) {
    if (!entry) return 0;
    return entry.items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
  }
  function blankForm() {
    return {
      id: null,
      date: todayISO(),
      note: "",
      simpleMode: true,
      simpleAmount: "",
      items: DEFAULT_CATEGORIES.map((label) => ({ id: uid(), label, amount: "" })),
    };
  }

  function computeCostBasisSeries(sortedEntries, contributions, manualBalances) {
    const byYearLastEntry = {};
    sortedEntries.forEach((e) => {
      byYearLastEntry[e.date.slice(0, 4)] = e;
    });
    function yearEndBalance(y) {
      if (byYearLastEntry[y]) return totalOf(byYearLastEntry[y]);
      if (manualBalances[y] !== undefined) return manualBalances[y];
      return null;
    }
    return sortedEntries.map((e) => {
      const year = e.date.slice(0, 4);
      const prevYear = String(Number(year) - 1);
      const startBalance = yearEndBalance(prevYear);
      const total = totalOf(e);
      if (startBalance === null) return { id: e.id, gain: null, pct: null };
      const entryMonth = e.date.slice(0, 7);
      const cumulativeContrib = contributions
        .filter((c) => c.month && c.month.slice(0, 4) === year && c.month <= entryMonth)
        .reduce((s, c) => s + (Number(c.amount) || 0), 0);
      const costBasis = startBalance + cumulativeContrib;
      const gain = total - costBasis;
      const pct = costBasis ? (gain / costBasis) * 100 : null;
      return { id: e.id, gain, pct };
    });
  }

  function computeYearlyReturns(sortedEntries, contributions, manualBalances) {
    const byYearLastEntry = {};
    sortedEntries.forEach((e) => {
      byYearLastEntry[e.date.slice(0, 4)] = e;
    });
    function balanceForYear(y) {
      if (byYearLastEntry[y]) return totalOf(byYearLastEntry[y]);
      if (manualBalances[y] !== undefined) return manualBalances[y];
      return null;
    }
    function isManual(y) {
      return !byYearLastEntry[y] && manualBalances[y] !== undefined;
    }
    const years = new Set([
      ...Object.keys(byYearLastEntry),
      ...Object.keys(manualBalances).map((y) => String(Number(y) + 1)),
    ]);
    const rows = [];
    [...years].sort().forEach((y) => {
      const prevY = String(Number(y) - 1);
      const startBalance = balanceForYear(prevY);
      const endBalance = balanceForYear(y);
      if (startBalance === null || endBalance === null) return;
      const contribTotal = contributions
        .filter((c) => c.month && c.month.slice(0, 4) === y)
        .reduce((s, c) => s + (Number(c.amount) || 0), 0);
      const gain = endBalance - startBalance - contribTotal;
      const pct = startBalance ? (gain / startBalance) * 100 : null;
      rows.push({
        year: y, startBalance, endBalance, contribTotal, gain, pct,
        startIsManual: isManual(prevY), endIsManual: isManual(y),
      });
    });
    return rows.reverse();
  }

  const state = {
    entries: load(LS.entries),
    contributions: load(LS.contributions),
    yearBalances: load(LS.yearBalances),
    planLog: load(LS.planLog),
    view: "overview",
    form: blankForm(),
    editingId: null,
    contribForm: { month: currentMonthISO(), amount: "" },
    yearBalanceForm: { year: String(new Date().getFullYear() - 1), amount: "" },
    planForm: { month: currentMonthISO(), savingsRate: "", investmentPlan: "" },
    compareMode: "cost",
    saveError: "",
  };

  function sortedEntries() {
    return [...state.entries].sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  function persistEntries() { save(LS.entries, state.entries); }
  function persistContributions() { save(LS.contributions, state.contributions); }
  function persistYearBalances() { save(LS.yearBalances, state.yearBalances); }
  function persistPlanLog() { save(LS.planLog, state.planLog); }

  const PALETTE = ["#2F6F5E", "#B8863A", "#5B7FA6", "#8C5E58", "#7A8450", "#9C6B9E", "#4C6B6B"];

  const TABS = [
    { key: "overview", label: "ภาพรวม" },
    { key: "add", label: "บันทึกข้อมูล" },
    { key: "history", label: "ประวัติ" },
    { key: "returns", label: "ผลตอบแทน" },
  ];

  let chartInstance = null;

  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = TABS.map(
      (t) =>
        `<button class="tab-btn ${state.view === t.key ? "active" : ""}" data-tab="${t.key}">${t.label}</button>`
    ).join("");
    el.querySelectorAll("[data-tab]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.tab === "add") startAdd();
        else state.view = btn.dataset.tab;
        render();
      });
    });
  }

  function renderHero() {
    const entries = sortedEntries();
    const latest = entries[entries.length - 1] || null;
    const prev = entries.length > 1 ? entries[entries.length - 2] : null;
    const amountEl = document.getElementById("heroAmount");
    const subEl = document.getElementById("heroSub");
    if (!latest) {
      amountEl.textContent = "ยังไม่มีข้อมูล";
      subEl.textContent = "";
      return;
    }
    const t = totalOf(latest);
    amountEl.textContent = "฿" + fmtBaht(t);
    let sub = "ณ " + fmtDateThai(latest.date);
    if (prev) {
      const diff = t - totalOf(prev);
      const pct = totalOf(prev) ? (diff / totalOf(prev)) * 100 : null;
      sub += ` · ${diff >= 0 ? "+" : ""}${fmtBaht(diff)}${pct !== null ? ` (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)` : ""}`;
    }
    subEl.textContent = sub;
  }

  function startAdd() {
    state.form = blankForm();
    state.editingId = null;
    state.view = "add";
  }

  function startEdit(entry) {
    const isSimple = entry.items.length === 1 && entry.items[0].label === "ยอดรวมพอร์ท";
    state.form = {
      id: entry.id,
      date: entry.date,
      note: entry.note || "",
      simpleMode: isSimple,
      simpleAmount: isSimple ? String(entry.items[0].amount) : "",
      items: entry.items.map((it) => ({ id: uid(), label: it.label, amount: String(it.amount) })),
    };
    state.editingId = entry.id;
    state.view = "add";
  }

  function saveForm() {
    let cleanItems;
    if (state.form.simpleMode) {
      if (!state.form.simpleAmount) {
        state.saveError = "กรุณากรอกยอดรวม";
        render();
        return;
      }
      cleanItems = [{ label: "ยอดรวมพอร์ท", amount: Number(state.form.simpleAmount) || 0 }];
    } else {
      cleanItems = state.form.items
        .map((it) => ({ label: (it.label || "").trim() || "อื่นๆ", amount: Number(it.amount) || 0 }))
        .filter((it) => it.amount !== 0 || state.form.items.length === 1);
      if (cleanItems.length === 0) {
        state.saveError = "กรุณากรอกอย่างน้อยหนึ่งรายการ";
        render();
        return;
      }
    }
    const entry = {
      id: state.editingId || uid(),
      date: state.form.date || todayISO(),
      note: state.form.note,
      items: cleanItems,
    };
    if (state.editingId) {
      state.entries = state.entries.map((e) => (e.id === state.editingId ? entry : e));
    } else {
      state.entries = [...state.entries, entry];
    }
    persistEntries();
    state.saveError = "";
    state.view = "history";
    render();
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter((e) => e.id !== id);
    persistEntries();
    render();
  }

  function addContribution() {
    const f = state.contribForm;
    if (!f.month || !f.amount) {
      state.saveError = "กรุณากรอกเดือนและจำนวนเงินนำส่ง";
      render();
      return;
    }
    const existing = state.contributions.find((c) => c.month === f.month);
    if (existing) {
      state.contributions = state.contributions.map((c) =>
        c.month === f.month ? { ...c, amount: Number(f.amount) } : c
      );
    } else {
      state.contributions = [...state.contributions, { id: uid(), month: f.month, amount: Number(f.amount) }];
    }
    persistContributions();
    state.contribForm.amount = "";
    state.saveError = "";
    render();
  }
  function deleteContribution(id) {
    state.contributions = state.contributions.filter((c) => c.id !== id);
    persistContributions();
    render();
  }

  function addYearBalance() {
    const f = state.yearBalanceForm;
    if (!f.year || !f.amount) {
      state.saveError = "กรุณากรอกปีและยอดเงิน";
      render();
      return;
    }
    const y = String(f.year);
    const existing = state.yearBalances.find((b) => b.year === y);
    if (existing) {
      state.yearBalances = state.yearBalances.map((b) =>
        b.year === y ? { ...b, balance: Number(f.amount) } : b
      );
    } else {
      state.yearBalances = [...state.yearBalances, { id: uid(), year: y, balance: Number(f.amount) }];
    }
    persistYearBalances();
    state.yearBalanceForm.amount = "";
    state.saveError = "";
    render();
  }
  function deleteYearBalance(id) {
    state.yearBalances = state.yearBalances.filter((b) => b.id !== id);
    persistYearBalances();
    render();
  }

  function addPlanLog() {
    const f = state.planForm;
    if (!f.month || (!f.savingsRate && !f.investmentPlan)) {
      state.saveError = "กรุณากรอกเดือน และอัตราออมเพิ่มหรือแผนการลงทุนอย่างน้อยหนึ่งอย่าง";
      render();
      return;
    }
    const existing = state.planLog.find((p) => p.month === f.month);
    const patch = {
      savingsRate: f.savingsRate ? Number(f.savingsRate) : null,
      investmentPlan: f.investmentPlan || null,
    };
    if (existing) {
      state.planLog = state.planLog.map((p) => (p.month === f.month ? { ...p, ...patch } : p));
    } else {
      state.planLog = [...state.planLog, { id: uid(), month: f.month, ...patch }];
    }
    persistPlanLog();
    state.planForm.savingsRate = "";
    state.planForm.investmentPlan = "";
    state.saveError = "";
    render();
  }
  function deletePlanLog(id) {
    state.planLog = state.planLog.filter((p) => p.id !== id);
    persistPlanLog();
    render();
  }

  function renderOverview() {
    const entries = sortedEntries();
    const latest = entries[entries.length - 1] || null;
    if (!latest) {
      return `
        <div class="empty-state">
          <div class="muted" style="margin-bottom:16px;">ยังไม่มีข้อมูลพอร์ท เริ่มบันทึกรายการแรกของคุณ</div>
          <button class="btn-primary" data-action="start-add">+ บันทึกข้อมูล</button>
        </div>`;
    }
    const total = totalOf(latest);
    const isDetailed = latest.items.length > 1;
    const rows = isDetailed ? [...latest.items].sort((a, b) => b.amount - a.amount) : [];

    const manualMap = {};
    state.yearBalances.forEach((b) => { manualMap[b.year] = Number(b.balance); });
    const costBasisSeries = computeCostBasisSeries(entries, state.contributions, manualMap);
    const costBasisById = {};
    costBasisSeries.forEach((r) => { costBasisById[r.id] = r; });

    const reversed = [...entries].reverse();
    const visibleRows = reversed.slice(0, 12);

    let html = "";
    if (entries.length > 1) {
      html += `
        <div class="section-title">การเติบโตของพอร์ท</div>
        <div class="chart-wrap"><canvas id="growthChart"></canvas></div>`;
    }

    html += `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div class="section-title" style="margin-bottom:0;">บันทึกยอดรวม</div>
        <div style="display:flex; gap:4px;">
          <button class="toggle-btn-sm ${state.compareMode === "cost" ? "active" : ""}" data-action="compare-mode" data-mode="cost">เทียบต้นทุน</button>
          <button class="toggle-btn-sm ${state.compareMode === "previous" ? "active" : ""}" data-action="compare-mode" data-mode="previous">เทียบรายการก่อนหน้า</button>
        </div>
      </div>`;

    visibleRows.forEach((e, idx) => {
      const t = totalOf(e);
      let gain = null, pct = null;
      if (state.compareMode === "cost") {
        const r = costBasisById[e.id];
        if (r) { gain = r.gain; pct = r.pct; }
      } else {
        const prevEntry = reversed[idx + 1];
        if (prevEntry) {
          const prevTotal = totalOf(prevEntry);
          gain = t - prevTotal;
          pct = prevTotal ? (gain / prevTotal) * 100 : null;
        }
      }
      html += `
        <div class="row hairline">
          <span>${fmtDateThai(e.date)}</span>
          <div style="text-align:right;">
            <span class="serif-num">฿${fmtBaht(t)}</span>
            ${gain !== null ? `<span style="margin-left:8px; font-size:12px; color:${gain >= 0 ? "var(--teal)" : "var(--rose)"};">${gain >= 0 ? "+" : ""}${fmtBaht(gain)}${pct !== null ? ` (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)` : ""}</span>` : ""}
          </div>
        </div>`;
    });
    if (entries.length > visibleRows.length) {
      html += `<button class="link-btn" style="margin-top:8px;" data-action="goto-history">ดูทั้งหมด (${entries.length} รายการ)</button>`;
    }

    if (isDetailed) {
      html += `<div class="section-title" style="margin-top:24px;">สัดส่วนล่าสุด (${fmtDateThai(latest.date)})</div>`;
      html += `<div class="segbar">` + rows.map((it, i) =>
        `<div style="width:${total ? (it.amount / total) * 100 : 0}%; background:${PALETTE[i % PALETTE.length]};"></div>`
      ).join("") + `</div>`;
      rows.forEach((it, i) => {
        html += `
          <div class="row hairline">
            <div><span class="legend-dot" style="background:${PALETTE[i % PALETTE.length]};"></span>${it.label}</div>
            <div style="text-align:right;">
              <span class="serif-num">฿${fmtBaht(it.amount)}</span>
              <span class="muted" style="margin-left:8px; font-size:12px;">${total ? ((it.amount / total) * 100).toFixed(2) : "0"}%</span>
            </div>
          </div>`;
      });
    }
    return html;
  }

  function renderAdd() {
    const f = state.form;
    const total = f.items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
    let html = `
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button class="toggle-btn ${f.simpleMode ? "active" : ""}" data-action="set-mode" data-mode="simple">ยอดรวม</button>
        <button class="toggle-btn ${!f.simpleMode ? "active" : ""}" data-action="set-mode" data-mode="detailed">แยกตามรายการ (ขั้นสูง)</button>
      </div>
      <div class="field">
        <label class="field-label">วันที่</label>
        <input type="date" id="f-date" value="${f.date}" />
      </div>`;

    if (f.simpleMode) {
      html += `
        <div class="field">
          <label class="field-label">ยอดรวมพอร์ท</label>
          <input type="text" inputmode="decimal" id="f-simple-amount" placeholder="เช่น 850000.50" value="${f.simpleAmount}" />
        </div>`;
    } else {
      html += `<div class="section-title">รายการ / สัดส่วนสินทรัพย์</div>`;
      f.items.forEach((it) => {
        html += `
          <div class="item-row" data-item-id="${it.id}">
            <input type="text" class="item-label" placeholder="ชื่อรายการ" value="${it.label}" />
            <input type="text" inputmode="decimal" class="item-amount" placeholder="จำนวนเงิน" value="${it.amount}" style="width:110px; flex:none;" />
            <button class="remove-btn" data-action="remove-item" data-id="${it.id}">✕</button>
          </div>`;
      });
      html += `<button class="link-btn" style="margin-bottom:16px;" data-action="add-item">+ เพิ่มรายการ</button>`;
      html += `
        <div class="row hairline" style="margin-bottom:16px;">
          <span class="muted">รวมทั้งหมด</span>
          <span class="serif-num">฿${fmtBaht(total)}</span>
        </div>`;
    }

    html += `
      <div class="field">
        <label class="field-label">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="f-note" value="${f.note}" />
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" style="flex:1;" data-action="save-entry">${state.editingId ? "บันทึกการแก้ไข" : "บันทึกรายการ"}</button>
        <button class="btn-ghost" data-action="cancel-add">ยกเลิก</button>
      </div>`;
    if (state.saveError) html += `<div class="err">${state.saveError}</div>`;
    return html;
  }

  function renderHistory() {
    const entries = sortedEntries();
    if (entries.length === 0) {
      return `
        <div class="empty-state">
          <div class="muted" style="margin-bottom:16px;">ยังไม่มีประวัติการบันทึก</div>
          <button class="btn-primary" data-action="start-add">+ บันทึกข้อมูล</button>
        </div>`;
    }
    let html = "";
    [...entries].reverse().forEach((e) => {
      const isSimple = e.items.length === 1 && e.items[0].label === "ยอดรวมพอร์ท";
      html += `
        <div class="hairline" style="padding:12px 0;">
          <div class="row" style="padding:0;">
            <span style="font-weight:500;">${fmtDateThai(e.date)}</span>
            <span class="serif-num">฿${fmtBaht(totalOf(e))}</span>
          </div>
          ${e.note ? `<div class="muted" style="font-size:12px; margin-top:4px;">${e.note}</div>` : ""}
          <div class="muted" style="font-size:12px; margin-top:4px;">
            ${isSimple ? "บันทึกแบบยอดรวม" : e.items.map((it) => it.label).join(" · ")}
          </div>
          <div style="display:flex; gap:12px; margin-top:8px;">
            <button class="link-btn" data-action="edit-entry" data-id="${e.id}">แก้ไข</button>
            <button class="link-btn" style="color:var(--rose);" data-action="delete-entry" data-id="${e.id}">ลบ</button>
          </div>
        </div>`;
    });
    return html;
  }

  function renderReturns() {
    const entries = sortedEntries();
    const manualMap = {};
    state.yearBalances.forEach((b) => { manualMap[b.year] = Number(b.balance); });
    const rows = computeYearlyReturns(entries, state.contributions, manualMap);
    const sortedContrib = [...state.contributions].sort((a, b) => b.month.localeCompare(a.month));
    const sortedBalances = [...state.yearBalances].sort((a, b) => b.year.localeCompare(a.year));
    const sortedPlanLog = [...state.planLog].sort((a, b) => b.month.localeCompare(a.month));
    const latestPlan = sortedPlanLog[0] || null;

    let html = `
      <div style="margin-bottom:24px;">
        <div class="section-title" style="margin-bottom:4px;">กำไร/ผลตอบแทนรายปี</div>
        <div class="note">คำนวณจาก ยอดปลายปี − ยอดต้นปี − เงินนำส่งที่บันทึกไว้ในปีนั้น</div>`;
    if (rows.length === 0) {
      html += `<div class="muted" style="padding:16px 0;">ยังไม่มีข้อมูลพอคำนวณ — บันทึกยอดพอร์ทของปีนี้ไว้อย่างน้อย 1 ครั้ง แล้วกรอก "ยอดปลายปีก่อนหน้า" ด้านล่างเพื่อเป็นจุดเริ่มต้น</div>`;
    } else {
      rows.forEach((r) => {
        html += `
          <div class="hairline" style="padding:12px 0;">
            <div class="row" style="padding:0;">
              <span style="font-weight:500;">ปี ${r.year}</span>
              <span class="serif-num" style="color:${r.gain >= 0 ? "var(--teal)" : "var(--rose)"};">${r.gain >= 0 ? "+" : ""}${fmtBaht(r.gain)} (${r.pct !== null ? `${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(2)}%` : "-"})</span>
            </div>
            <div class="muted" style="font-size:12px; margin-top:4px;">
              ยอดต้นปี ฿${fmtBaht(r.startBalance)}${r.startIsManual ? " (กรอกเอง)" : ""} · ยอดปลายปี ฿${fmtBaht(r.endBalance)}${r.endIsManual ? " (กรอกเอง)" : ""} · เงินนำส่งรวม ฿${fmtBaht(r.contribTotal)}
            </div>
          </div>`;
      });
    }
    html += `</div>`;

    html += `
      <div style="margin-bottom:24px;">
        <div class="section-title">อัตราออมเพิ่ม & แผนการลงทุน</div>
        ${latestPlan ? `<div class="note">ล่าสุด (${latestPlan.month}): ${latestPlan.savingsRate !== null ? `ออมเพิ่ม ${latestPlan.savingsRate}%` : ""}${latestPlan.savingsRate !== null && latestPlan.investmentPlan ? " · " : ""}${latestPlan.investmentPlan || ""}</div>` : ""}
        <div class="plan-inputs">
          <input type="month" id="plan-month" value="${state.planForm.month}" />
          <input type="text" inputmode="decimal" id="plan-rate" placeholder="% ออมเพิ่ม" value="${state.planForm.savingsRate}" style="width:90px; flex:none;" />
          <input type="text" id="plan-name" placeholder="ชื่อแผนการลงทุน" value="${state.planForm.investmentPlan}" style="flex:1;" />
        </div>
        <button class="btn-primary" style="margin-bottom:12px;" data-action="add-plan">บันทึก</button>`;
    if (sortedPlanLog.length === 0) {
      html += `<div class="muted" style="font-size:12px;">ยังไม่มีข้อมูล</div>`;
    } else {
      sortedPlanLog.forEach((p) => {
        html += `
          <div class="row hairline">
            <span>${p.month}</span>
            <div style="display:flex; align-items:center; gap:12px;">
              <span>${p.savingsRate !== null ? `${p.savingsRate}%` : ""}${p.savingsRate !== null && p.investmentPlan ? " · " : ""}${p.investmentPlan || ""}</span>
              <button class="link-btn" style="color:var(--rose); font-size:12px;" data-action="delete-plan" data-id="${p.id}">ลบ</button>
            </div>
          </div>`;
      });
    }
    html += `</div>`;

    html += `
      <div style="margin-bottom:24px;">
        <div class="section-title">กรอกยอดปลายปีเอง (ใช้เมื่อไม่มีข้อมูลบันทึกไว้ในระบบสำหรับปีนั้น)</div>
        <div class="plan-inputs">
          <input type="number" id="yb-year" placeholder="ปี เช่น 2025" value="${state.yearBalanceForm.year}" style="width:100px; flex:none;" />
          <input type="text" inputmode="decimal" id="yb-amount" placeholder="ยอดปลายปี (บาท)" value="${state.yearBalanceForm.amount}" style="flex:1;" />
        </div>
        <button class="btn-primary" style="margin-bottom:12px;" data-action="add-yb">เพิ่ม</button>`;
    if (sortedBalances.length === 0) {
      html += `<div class="muted" style="font-size:12px;">ยังไม่มียอดปลายปีที่กรอกเอง</div>`;
    } else {
      sortedBalances.forEach((b) => {
        html += `
          <div class="row hairline">
            <span>ปลายปี ${b.year}</span>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="serif-num">฿${fmtBaht(b.balance)}</span>
              <button class="link-btn" style="color:var(--rose); font-size:12px;" data-action="delete-yb" data-id="${b.id}">ลบ</button>
            </div>
          </div>`;
      });
    }
    html += `</div>`;

    html += `
      <div>
        <div class="section-title">บันทึกเงินนำส่งรายเดือน (เงินสะสม + สมทบที่เข้าพอร์ท)</div>
        <div class="plan-inputs">
          <input type="month" id="contrib-month" value="${state.contribForm.month}" style="flex:1;" />
          <input type="text" inputmode="decimal" id="contrib-amount" placeholder="จำนวนเงิน" value="${state.contribForm.amount}" style="width:90px; flex:none;" />
        </div>
        <button class="btn-primary" style="margin-bottom:12px;" data-action="add-contrib">เพิ่ม</button>`;
    if (sortedContrib.length === 0) {
      html += `<div class="muted" style="font-size:12px;">ยังไม่มีข้อมูลเงินนำส่ง</div>`;
    } else {
      sortedContrib.forEach((c) => {
        html += `
          <div class="row hairline">
            <span>${c.month}</span>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="serif-num">฿${fmtBaht(c.amount)}</span>
              <button class="link-btn" style="color:var(--rose); font-size:12px;" data-action="delete-contrib" data-id="${c.id}">ลบ</button>
            </div>
          </div>`;
      });
    }
    html += `</div>`;
    if (state.saveError) html += `<div class="err">${state.saveError}</div>`;
    return html;
  }

  function renderGrowthChart() {
    const canvas = document.getElementById("growthChart");
    if (!canvas) return;
    if (typeof Chart === "undefined") {
      canvas.replaceWith(Object.assign(document.createElement("div"), {
        className: "muted",
        style: "font-size:13px; padding:12px 0;",
        textContent: "โหลดกราฟไม่สำเร็จ (ไม่พบอินเทอร์เน็ต หรือตัวช่วยแสดงกราฟถูกบล็อก) — ตัวเลขยอดรวมด้านล่างยังใช้งานได้ตามปกติ",
      }));
      return;
    }
    const entries = sortedEntries();
    const labels = entries.map((e) => fmtDateThai(e.date));
    const data = entries.map((e) => totalOf(e));
    if (chartInstance) chartInstance.destroy();

    const dataMin = Math.min(...data);
    const dataMax = Math.max(...data);
    const range = dataMax - dataMin;
    const padding = range > 0 ? range * 0.25 : Math.max(dataMax * 0.05, 1000);
    const yMin = Math.max(0, Math.floor(dataMin - padding));
    const yMax = Math.ceil(dataMax + padding);

    chartInstance = new Chart(canvas, {
      type: "line",
      data: {
        labels,
        datasets: [{
          data,
          borderColor: "#2F6F5E",
          backgroundColor: "rgba(47,111,94,0.1)",
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: "#2F6F5E",
          fill: true,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => "฿" + fmtBaht(ctx.parsed.y) } },
        },
        scales: {
          x: { ticks: { font: { size: 10 } }, grid: { display: false } },
          y: {
            min: yMin,
            max: yMax,
            ticks: {
              font: { size: 10 },
              callback: (v) => Math.round(v / 1000) + "k",
            },
            grid: { color: "#E1DCCF" },
          },
        },
      },
    });
  }

  function attachContentEvents() {
    const c = document.getElementById("content");

    c.querySelectorAll("[data-action]").forEach((el) => {
      el.addEventListener("click", (e) => {
        const action = el.dataset.action;
        if (action === "start-add") startAdd();
        else if (action === "goto-history") state.view = "history";
        else if (action === "compare-mode") state.compareMode = el.dataset.mode;
        else if (action === "set-mode") state.form.simpleMode = el.dataset.mode === "simple";
        else if (action === "add-item") state.form.items.push({ id: uid(), label: "", amount: "" });
        else if (action === "remove-item") state.form.items = state.form.items.filter((it) => it.id !== el.dataset.id);
        else if (action === "save-entry") { syncFormFromInputs(); saveForm(); return; }
        else if (action === "cancel-add") state.view = sortedEntries().length ? "history" : "overview";
        else if (action === "edit-entry") startEdit(state.entries.find((x) => x.id === el.dataset.id));
        else if (action === "delete-entry") { deleteEntry(el.dataset.id); return; }
        else if (action === "add-contrib") { syncMiscInputs(); addContribution(); return; }
        else if (action === "delete-contrib") { deleteContribution(el.dataset.id); return; }
        else if (action === "add-yb") { syncMiscInputs(); addYearBalance(); return; }
        else if (action === "delete-yb") { deleteYearBalance(el.dataset.id); return; }
        else if (action === "add-plan") { syncMiscInputs(); addPlanLog(); return; }
        else if (action === "delete-plan") { deletePlanLog(el.dataset.id); return; }
        render();
      });
    });

    // keep form state in sync as the user types (so it survives re-render on other actions)
    const dateInput = document.getElementById("f-date");
    if (dateInput) dateInput.addEventListener("input", (e) => (state.form.date = e.target.value));
    const noteInput = document.getElementById("f-note");
    if (noteInput) noteInput.addEventListener("input", (e) => (state.form.note = e.target.value));
    const simpleAmountInput = document.getElementById("f-simple-amount");
    if (simpleAmountInput) simpleAmountInput.addEventListener("input", (e) => (state.form.simpleAmount = e.target.value));
    c.querySelectorAll(".item-row").forEach((row) => {
      const id = row.dataset.itemId;
      const labelInput = row.querySelector(".item-label");
      const amountInput = row.querySelector(".item-amount");
      labelInput.addEventListener("input", (e) => {
        const it = state.form.items.find((x) => x.id === id);
        if (it) it.label = e.target.value;
      });
      amountInput.addEventListener("input", (e) => {
        const it = state.form.items.find((x) => x.id === id);
        if (it) it.amount = e.target.value;
        const totalEl = c.querySelector(".serif-num");
      });
    });
  }

  function syncFormFromInputs() {
    const dateInput = document.getElementById("f-date");
    const noteInput = document.getElementById("f-note");
    const simpleAmountInput = document.getElementById("f-simple-amount");
    if (dateInput) state.form.date = dateInput.value;
    if (noteInput) state.form.note = noteInput.value;
    if (simpleAmountInput) state.form.simpleAmount = simpleAmountInput.value;
    document.querySelectorAll(".item-row").forEach((row) => {
      const id = row.dataset.itemId;
      const it = state.form.items.find((x) => x.id === id);
      if (it) {
        it.label = row.querySelector(".item-label").value;
        it.amount = row.querySelector(".item-amount").value;
      }
    });
  }

  function syncMiscInputs() {
    const cm = document.getElementById("contrib-month");
    const ca = document.getElementById("contrib-amount");
    if (cm) state.contribForm.month = cm.value;
    if (ca) state.contribForm.amount = ca.value;
    const ybY = document.getElementById("yb-year");
    const ybA = document.getElementById("yb-amount");
    if (ybY) state.yearBalanceForm.year = ybY.value;
    if (ybA) state.yearBalanceForm.amount = ybA.value;
    const pm = document.getElementById("plan-month");
    const pr = document.getElementById("plan-rate");
    const pn = document.getElementById("plan-name");
    if (pm) state.planForm.month = pm.value;
    if (pr) state.planForm.savingsRate = pr.value;
    if (pn) state.planForm.investmentPlan = pn.value;
  }

  function render() {
    renderHero();
    renderTabs();
    const content = document.getElementById("content");
    if (state.view === "overview") content.innerHTML = renderOverview();
    else if (state.view === "add") content.innerHTML = renderAdd();
    else if (state.view === "history") content.innerHTML = renderHistory();
    else if (state.view === "returns") content.innerHTML = renderReturns();
    attachContentEvents();
    if (state.view === "overview") renderGrowthChart();
  }

  render();
</script>
</body>
</html>
